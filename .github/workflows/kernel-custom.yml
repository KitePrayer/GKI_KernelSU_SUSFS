name: Android 内核构建-自定义

permissions:
  contents: write
  actions: write

on:
  workflow_dispatch:
    inputs:
      # ==================== 内核版本配置 ====================
      android_version:
        description: "Android 版本"
        required: true
        type: choice
        options:
          - android12
          - android13
          - android14
          - android15
          - android16
        default: android12
      kernel_version:
        description: "内核版本"
        required: true
        type: choice
        options:
          - "5.10"
          - "5.15"
          - "6.1"
          - "6.6"
          - "6.12"
        default: "5.10"
      sub_level:
        description: "子版本号 (如 66, 198, X)"
        required: true
        type: string
        default: "66"
      os_patch_level:
        description: "安全补丁级别 (如 2022-01, lts)"
        required: true
        type: string
        default: "2022-01"
      revision:
        description: "修订版本 (如 r11, 仅 5.10 需要)"
        required: false
        type: string
        default: "r11"

      # ==================== 自定义内核源码 ====================
      custom_kernel_source:
        description: "自定义内核源码 git 地址（留空=编译 AOSP GKI 原版）"
        required: false
        type: string
        default: ""
      custom_kernel_branch:
        description: "源码分支/tag（留空=仓库默认分支，厂商仓库常为 master）"
        required: false
        type: string
        default: ""
      custom_kernel_subdir:
        description: "源码在仓库中的子目录（如 common/ ；根目录留空）"
        required: false
        type: string
        default: ""
      custom_vendor_source:
        description: "厂商 vendor 源码 git 地址（必填：common 里有指向 vendor/oplus 的软链，不补会编译失败）"
        required: false
        type: string
        default: ""
      custom_vendor_branch:
        description: "vendor 源码分支（留空=仓库默认分支）"
        required: false
        type: string
        default: ""

      # ==================== KernelSU 配置 ====================
      kernelsu_variant:
        description: "KernelSU 变体"
        required: true
        type: choice
        options:
          - Official
          #- Next
          - SukiSU
          - SukiSUNova
          - SukiSU(40726)
          - SukiSU(40548)
          - ReSukiSU
        default: ReSukiSU

      # ==================== SukiSU Nova 配置 ====================
      nova_source:
        description: "Nova 仓库 owner/repo（仅 kernelsu_variant=SukiSUNova 时生效）"
        required: false
        type: string
        default: "SukiSU-Nova/SukiSU-Nova"
      nova_branch:
        description: "Nova 分支：main(kprobe，可编模块) / builtin(纯内置 hook)"
        required: false
        type: choice
        options:
          - main
          - builtin
        default: main
      nova_ref:
        description: "Nova 的 tag/commit（留空=分支最新）"
        required: false
        type: string
        default: ""

      # ==================== 可选配置 ====================
      version:
        description: "自定义版本名 (可选)"
        required: false
        type: string
      build_time:
        description: "自定义构建时间 (可选，N或留空=当前UTC)"
        required: false
        type: string
        default: "Sun Dec 01 08:10:00 UTC 2024"

      # ==================== 选项配置 ====================
      use_kpm:
        description: "KPM 功能（patched 尚不支持）"
        required: true
        type: choice
        default: "disabled (关闭)"
        options:
          - "disabled (关闭)"
          - "enabled (开启)"
          - "patched (开启并修补，尚不支持)"
      droidspaces:
        description: "Droidspaces 容器支持 (5.10~6.6: 槽位补丁, 6.12: 开/关)"
        required: false
        type: choice
        options:
          - "off"
          - "678"
          - "123"
          - "345"
        default: "off"
      droidspaces_ntsync:
        description: "启用 Droidspaces 容器 NTSync 支持（需启用 Droidspaces）"
        required: false
        type: boolean
        default: false

      # ==================== 功能开关 ====================
      use_zram:
        description: "启用 ZRAM 增强算法"
        required: true
        type: boolean
        default: false
      use_bbg:
        description: "启用 BBG 防格机"
        required: true
        type: boolean
        default: false
      use_rekernel:
        description: "启用 Re-Kernel 驱动"
        required: false
        type: boolean
        default: false
      cancel_susfs:
        description: "禁用 SUSFS"
        required: true
        type: boolean
        default: false
      supp_op:
        description: "启用一加 8E 支持"
        required: false
        type: boolean
        default: false

jobs:
  build-custom-kernel:
    name: "${{ inputs.kernel_version }}.${{ inputs.sub_level }}-${{ inputs.android_version }}-${{ inputs.os_patch_level }}"
    uses: ./.github/workflows/build.yml
    secrets: inherit
    with:
      android_version: ${{ inputs.android_version }}
      kernel_version: ${{ inputs.kernel_version }}
      sub_level: ${{ inputs.sub_level }}
      os_patch_level: ${{ inputs.os_patch_level }}
      revision: ${{ inputs.revision || '' }}
      ksu_variant: ${{ inputs.kernelsu_variant }}
      version: ${{ inputs.version || '' }}
      build_time: ${{ inputs.build_time || '' }}
      use_zram: ${{ inputs.use_zram }}
      use_bbg: ${{ inputs.use_bbg }}
      use_kpm: ${{ inputs.use_kpm }}
      use_rekernel: ${{ inputs.use_rekernel || false }}
      supp_op: ${{ inputs.supp_op || false }}
      enable_susfs: ${{ !inputs.cancel_susfs }}
      droidspaces: ${{ inputs.droidspaces || 'off' }}
      droidspaces_ntsync: ${{ inputs.droidspaces_ntsync || false }}
      custom_kernel_source: ${{ inputs.custom_kernel_source || '' }}
      custom_kernel_branch: ${{ inputs.custom_kernel_branch || '' }}
      custom_kernel_subdir: ${{ inputs.custom_kernel_subdir || '' }}
      custom_vendor_source: ${{ inputs.custom_vendor_source || '' }}
      custom_vendor_branch: ${{ inputs.custom_vendor_branch || '' }}
      nova_source: ${{ inputs.nova_source || 'SukiSU-Nova/SukiSU-Nova' }}
      nova_branch: ${{ inputs.nova_branch || 'main' }}
      nova_ref: ${{ inputs.nova_ref || '' }}

  get-ksu-manager:
    uses: ./.github/workflows/get-manager.yml
    secrets: inherit
    with:
      kernelsu_variant: ${{ inputs.kernelsu_variant }}
